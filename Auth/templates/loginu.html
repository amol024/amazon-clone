{% extends 'base.html' %}
{% block title %}Login Page{% endblock %}
{% block content %}
<div>
    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <title>Login</title>

        <!-- Bootstrap 5.2 CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <style>
            body {
                background-color: #f6f6f6;
            }

            .login-card {
                max-width: 380px;
                margin: auto;
                border-radius: 6px;
            }

            .login-card h2 {
                font-weight: 500;
            }

            .btn-amazon {
                background-color: #f0c14b;
                border-color: #a88734;
                color: #111;
            }

            .btn-amazon:hover {
                background-color: #ddb347;
                border-color: #a88734;
            }

            .small-link {
                font-size: 13px;
            }
        </style>
    </head>

    <body>

        <div class="container d-flex align-items-center justify-content-center min-vh-100">

            <div class="card login-card shadow-sm p-4">
                {% if error %}
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    <strong>Error :-</strong> {{error}}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endif %}

                <!-- Logo -->
                <div class="text-center mb-3">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon Logo"
                        width="100">
                </div>

                <h2 class="mb-3">Login</h2>

                <form action="{% url 'loginu' %}" method="POST">
                    {% csrf_token %}
                    <!-- Email or username -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email or username</label>
                        <input type="text" name="username" class="form-control" required autocomplete="off">
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" required autocomplete="off">
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="btn btn-amazon w-100 mb-3">
                        Login 
                    </button>

                    <!-- Terms -->
                    <p class="small-link">
                        By continuing, you agree to Amazon's
                        <a href="#">Conditions of Use</a> and
                        <a href="#">Privacy Notice</a>.
                    </p>

                    <!-- Help -->
                    <div class="mt-2">
                        <a href="#" class="small-link">Forgot your password?</a>
                    </div>
                </form>

                <hr>

                <!-- Create Account -->
                <div class="text-center">
                    <p class="small-link text-muted mb-2">New to Amazon?</p>
                    <button class="btn btn-outline-secondary w-100">
                        <a href="{% url 'registeru' %}">Create your Amazon account</a>
                    </button>
                </div>

            </div>
        </div>

    </body>

    </html>

</div>

{% endblock %}
