{% extends 'base.html' %}

{% block content %}
<div class="container my-5">

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <!-- Checkout Card -->
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <h3 class="text-center fw-bold">Order Details</h3>

                    <form method="post">
                        {% csrf_token %}

                        <!-- Full Name -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Full Name</label>
                            <input type="text" class="form-control" name="full_name" placeholder="Enter your full name"
                                required>
                        </div>

                        <!-- Phone -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Phone Number</label>
                            <input type="tel" class="form-control" name="phone" placeholder="10-digit mobile number"
                                required>
                        </div>

                        <!-- Address -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Delivery Address</label>
                            <textarea class="form-control" name="address" rows="3" placeholder="House no, Street, Area"
                                required></textarea>
                        </div>

                        <!-- City & Pincode -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">City</label>
                                <input type="text" class="form-control" name="city" placeholder="City" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Pincode</label>
                                <input type="text" class="form-control" name="pincode" placeholder="Pincode" required>
                            </div>
                        </div>

                        <hr>

                        <!-- Order Summary -->
                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <h5 class="fw-bold mb-0">Total Amount</h5>
                                <h5 class="text-danger fw-bold mb-0">₹ {{ total }}</h5>
                            </div>
                        </div>

                        <!-- Payment Method Dropdown -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Payment Method</label>
                            <select class="form-select">
                                <option selected disabled>Select payment method</option>
                                <option>Cash on Delivery</option>
                                <option>UPI / Razorpay</option>
                                <option>Debit Card</option>
                                <option>Credit Card</option>
                                <option>Net Banking</option>
                            </select>
                        </div>

                        <p class="text-muted small mb-4">
                            🔒 100% secure payments
                        </p>

                        <!-- Pay Button -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-warning btn-lg fw-semibold">
                                Proceed to Pay
                            </button>
                        </div>

                    </form>

                </div>
            </div>

            <!-- Trust Info -->
            <div class="text-center mt-3 text-muted small">
                🔒 Secure payment | 🚚 Fast delivery | 💯 Trusted store
            </div>

        </div>
    </div>

</div>
{% endblock %}
