{% extends 'base.html' %}
{% block content %}

<h3>My Orders</h3>

{% for order in orders %}
<div class="card mb-3">
    <div class="card-body">
        <h5>Order ID: {{ order.id }}</h5>
        <p>Date: {{ order.created_at }}</p>
        <p>Total: {{ order.total_amount }}</p>
    </div>
</div>
{% empty %}
<p>No orders found.</p>
{% endfor %}

{% endblock %}
