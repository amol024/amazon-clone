{% extends 'base.html' %}
{% block content %}

<h3 class="text-center">Complete Payment</h3>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-sm border-0 text-center">
                <div class="card-body p-4">

                    <h3 class="fw-bold mb-3">🔒 Secure Payment</h3>

                    <p class="text-muted mb-4">
                        You are one step away from completing your order
                    </p>

                    <div class="mb-3">
                        <span class="text-muted">Amount to Pay</span>
                        <h2 class="fw-bold text-danger">₹ {{ total }}</h2>
                    </div>

                    <button id="rzp-button1" class="btn btn-warning btn-lg w-100 fw-semibold">
                        Pay Now
                    </button>

                    <p class="small text-muted mt-3">
                        Powered by Razorpay • 100% Secure Payments
                    </p>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
    var options = {
        "key": "{{ razorpay_key }}",
        "amount": "{{ amount|floatformat:0 }}00",  // rupees → paise
        "currency": "INR",
        "name": "Mini Amazon",
        "description": "Order Payment",
        "order_id": "{{ razorpay_order_id }}",
        "handler": function (response) {
            window.location.href = "{% url 'order_history' %}";
        },
        "theme": {
            "color": "#3399cc"
        }
    };

    var rzp1 = new Razorpay(options);

    document.getElementById('rzp-button1').onclick = function (e) {
        rzp1.open();
        e.preventDefault();
    }
</script>

{% endblock %}
